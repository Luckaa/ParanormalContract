<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contrato Paranormal</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Arial', sans-serif;
    background-color: #121212;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
  }

  h1 {
    font-family: 'Creepster', cursive; /* Se quiser fonte parecida com o app */
    margin-bottom: 20px;
  }

  .logo {
    width: 150px;
    margin-bottom: 30px;
  }

  button {
    width: 250px;
    padding: 15px;
    margin: 10px 0;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    background-color: #1f1f1f;
    color: #fff;
    transition: 0.2s;
  }

  button:hover {
    background-color: #333;
  }

  .fab {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background-color: #c79e2c;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

</style>
</head>
<body>

<h1>CONTRATO PARANORMAL</h1>
<img src="ghost.png" alt="Logo Fantasma" class="logo">

<button id="scan">ESCANEAR EVIDÊNCIAS - 0/3</button>
<button id="load">CARREGAR PARTIDA</button>

<div class="fab">📋</div>

<script>
  document.getElementById('scan').addEventListener('click', () => {
    alert('Função de escanear evidências ainda não implementada');
  });

  document.getElementById('load').addEventListener('click', () => {
    alert('Função de carregar partida ainda não implementada');
  });

  document.querySelector('.fab').addEventListener('click', () => {
    alert('Botão flutuante clicado!');
  });
</script>

</body>
</html>
